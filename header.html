  <!-- Styles -->
  <style>
    /* Grund-Layout */
    header {
      background-color: #004d00;
      padding: 10px 20px;
      color: white;
      font-family: Arial, sans-serif;
    }
  
    /* Header Top Bereich */
    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  
    /* Titel */
    header h1 {
      font-size: 2em;
      margin: 0;
    }
  
    /* Navigation */
    nav {
      display: flex;
      align-items: center;
    }
  
    /* Dropdown Menü */
    .dropdown {
      position: relative;
      margin-right: 20px;
    }
  
    .dropbtn {
      background-color: #004d00;
      color: white;
      padding: 10px 20px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
    }
  
    .dropdown-content {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      background-color: white;
      width: 200px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      border-radius: 5px;
      z-index: 10;
    }
  
    .dropdown-content a {
      display: block;
      padding: 12px;
      text-decoration: none;
      color: #333;
      font-size: 1em;
    }
  
    .dropdown-content a:hover {
      background-color: #f4f4f4;
    }
  
    .dropdown:hover .dropdown-content {
      display: block;
    }
  
    /* Buttons für Warenkorb & Anmelden */
    .nav-button {
      margin-right: 15px;
      background-color: #004d00;
      color: white;
      padding: 10px 20px;
      border-radius: 5px;
      text-decoration: none;
      border: none;
      font-size: 1em;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
  
    .nav-button:hover {
      background-color: #45a049;
    }
  
    /* Such-Button */
    .search-btn {
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #004d00;
      padding: 10px 15px;
      border-radius: 5px;
      text-decoration: none;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
  
    .search-btn img {
      width: 30px; /* Hier habe ich die Größe auf 30px geändert */
      height: 30px;
    }
  
    .search-btn:hover {
      background-color: #45a049;
    }
  </style>
