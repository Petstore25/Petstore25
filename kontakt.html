<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kontakt - Petstore25</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      background-color: #f9f9f9;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    main {
      padding: 60px 20px;
      max-width: 900px;
      margin: 0 auto;
      text-align: center;
    }

    h2 {
      font-size: 2.5em;
      color: #004d00;
      margin-bottom: 30px;
    }

    .contact-info {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
      display: inline-block;
      width: 100%;
      max-width: 600px;
    }

    .contact-info p {
      font-size: 1.1em;
      line-height: 1.6;
      color: #333;
      margin-bottom: 16px;
    }

    .contact-info a {
      color: #004d00;
      text-decoration: none;
      font-weight: bold;
    }

    .contact-info a:hover {
      text-decoration: underline;
    }

    .note {
      margin-top: 30px;
      font-style: italic;
      color: #666;
      font-size: 0.95em;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h2>Kontaktieren Sie uns</h2>
    <address class="contact-info">
      <p><strong>E-Mail:</strong> <a href="mailto:petstore25.official@gmail.com">petstore25.official@gmail.com</a></p>
      <p><strong>Telefonnummer:</strong> <a href="tel:+41774114637">+41 77 411 46 37</a></p>
      <p><strong>Instagram:</strong> <a href="https://www.instagram.com/petstore25" target="_blank" rel="noopener noreferrer">@petstore25</a></p>
      <p><strong>Twitter:</strong> <a href="https://twitter.com/petstore25" target="_blank" rel="noopener noreferrer">@petstore25</a></p>
      <p><strong>Facebook:</strong> <a href="https://www.facebook.com/petstore25" target="_blank" rel="noopener noreferrer">@petstore25</a></p>
      <p><strong>LinkedIn:</strong> <a href="https://www.linkedin.com/company/petstore25" target="_blank" rel="noopener noreferrer">Petstore25</a></p>
      <p><strong>YouTube:</strong> <a href="https://www.youtube.com/c/petstore25" target="_blank" rel="noopener noreferrer">Petstore25 Channel</a></p>
    </address>
    <p class="note">Hinweis: Diese Social-Media-Links sind fiktiv und dienen nur als Beispiel.</p>
  </main>

  <script>
    // Header dynamisch laden
    fetch("header.html")
      .then(response => response.text())
      .then(data => {
        document.getElementById("site-header").innerHTML = data;
      });
  </script>
</body>
</html>
