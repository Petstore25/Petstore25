<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start - Petstore25</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <style>
        body {
            background-color: #f9f9f9;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        main.content {
            text-align: center;
            padding: 50px 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        h2 {
            font-size: 2.5em;
            color: #004d00;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
            color: #333;
            margin-bottom: 30px;
        }

        .image-container {
            margin: 30px 0;
            text-align: center;
        }

        .image-container img {
            width: 100%;
            max-width: 700px;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
        }

        .cta-button {
            display: inline-block;
            margin-top: 30px;
            padding: 14px 28px;
            background-color: #004d00;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-size: 1.1em;
            transition: background-color 0.3s ease;
        }

        .cta-button:hover {
            background-color: #007700;
        }

        @media (max-width: 600px) {
            h2 {
                font-size: 1.8em;
            }

            p {
                font-size: 1em;
            }

            .image-container img {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div id="site-header"></div>

    <main class="content">
        <h2>Willkommen bei Petstore25</h2>
        <p>Alles für Ihr Haustier – hochwertig, liebevoll ausgewählt und schnell geliefert.</p>

        <div class="image-container">
            <img src="hund-und-katze.jpg" alt="Hund und Katze">
        </div>

        <p>Entdecken Sie Futter, Spielzeug, Pflege und Zubehör für Hunde & Katzen. Qualität, die begeistert – zu Preisen, die fair sind.</p>

        <a href="produkte.html" class="cta-button">Jetzt Produkte entdecken</a>
    </main>

    <script>
        fetch("header.html")
            .then(response => {
                if (!response.ok) throw new Error("Header konnte nicht geladen werden.");
                return response.text();
            })
            .then(data => {
                document.getElementById("site-header").innerHTML = data;
            })
            .catch(error => {
                document.getElementById("site-header").innerHTML = "<p style='text-align:center;color:red;'>Navigation konnte nicht geladen werden.</p>";
                console.error(error);
            });
    </script>
</body>
</html>
