<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suche | Petstore25</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
        }

        header {
            background-color: #004d00;
            color: white;
            padding: 15px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            font-size: 2em;
        }

        .search-container {
            display: flex;
            flex-direction: column;
            max-width: 800px;
            margin: 20px auto;
            padding: 15px;
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .search-container input,
        .search-container select,
        .search-container button {
            padding: 10px;
            font-size: 1em;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .search-container button {
            background-color: #004d00;
            color: white;
            cursor: pointer;
            border: none;
            transition: background-color 0.3s ease;
        }

        .search-container button:hover {
            background-color: #45a049;
        }

        .product-list {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .product-card {
            width: 250px;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 450px; /* Einheitliche Höhe für alle Karten */
        }

        .product-card img {
            width: 100%;
            height: 200px; /* Höhe für die Bilder */
            border-radius: 5px;
            object-fit: contain; /* Bild bleibt ganz, keine Ausschneidung */
        }

        .product-card h3 {
            font-size: 1.2em;
            margin: 10px 0;
        }

        .product-card p {
            font-size: 1em;
            color: #555;
        }

        .product-card .add-to-cart-btn {
            background-color: #45a049;
            color: white;
            border: none;
            padding: 10px;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        .product-card .add-to-cart-btn:hover {
            background-color: #388e3c;
        }

        .no-results {
            text-align: center;
            font-size: 1.5em;
            color: #333;
        }

        .back-to-home-btn {
            background-color: #004d00;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 5px;
            margin: 20px auto;
            display: block;
            transition: background-color 0.3s ease;
        }

        .back-to-home-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

<header>
    <h1>Petstore25</h1>
</header>

<!-- Button zurück zur Startseite -->
<button class="back-to-home-btn" onclick="window.location.href='index.html'">Zurück zur Startseite</button>

<div class="search-container">
    <h2>Erweiterte Suche</h2>
    <!-- Suchformular -->
    <div>
        <input type="text" id="search-input" placeholder="Wonach suchst du?" />

        <!-- Dropdown für Kategorien -->
        <select id="category-filter">
            <option value="alle">Alle Kategorien</option>
            <option value="hunde">Hunde Produkte</option>
            <option value="katzen">Katzen Produkte</option>
            <option value="spielzeug">Spielzeug</option>
            <option value="zubehoer">Zubehör</option>
        </select>

        <!-- Filter für Preis -->
        <input type="number" id="min-price" placeholder="Min. Preis" min="0" />
        <input type="number" id="max-price" placeholder="Max. Preis" min="0" />

        <!-- Filter für Bewertung -->
        <select id="rating-filter">
            <option value="alle">Alle Bewertungen</option>
            <option value="4">4 Sterne & mehr</option>
            <option value="3">3 Sterne & mehr</option>
            <option value="2">2 Sterne & mehr</option>
        </select>

        <button onclick="performSearch()">Suchen</button>
    </div>
</div>

<!-- Produktliste (wird dynamisch mit JavaScript gefüllt) -->
<div id="product-list" class="product-list"></div>

<!-- Script für die Suche -->
<script>
    // Dummy-Produkt-Daten für die Suche
    const products = [
        { name: "Hundespielzeug", category: "hunde", price: 19.99, rating: 5, image: "hundespielzeug.jpg" },
        { name: "Katzenkratzbaum", category: "katzen", price: 49.99, rating: 4, image: "katzenkratzbaum.jpg" },
        { name: "Spielzeug Ball", category: "spielzeug", price: 9.99, rating: 3, image: "spielzeug-ball.jpg" },
        { name: "Hundeleine", category: "hunde", price: 15.99, rating: 4, image: "hundeleine.jpg" },
        { name: "Katzenfutter", category: "katzen", price: 8.99, rating: 5, image: "katzenfutter.jpg" },
        { name: "Wassertrinker für Hunde", category: "zubehoer", price: 12.99, rating: 4, image: "wassertrinker.jpg" }
    ];

    // Funktion, um die Produkte basierend auf den Filtern anzuzeigen
    function performSearch() {
        const searchTerm = document.getElementById("search-input").value.trim().toLowerCase();
        const category = document.getElementById("category-filter").value;
        const minPrice = parseFloat(document.getElementById("min-price").value) || 0;
        const maxPrice = parseFloat(document.getElementById("max-price").value) || Infinity;
        const rating = parseInt(document.getElementById("rating-filter").value) || 0;

        // Filtern der Produkte basierend auf den Eingaben
        const filteredProducts = products.filter(product => {
            const matchesSearchTerm = product.name.toLowerCase().includes(searchTerm);
            const matchesCategory = category === "alle" || product.category === category;
            const matchesPrice = product.price >= minPrice && product.price <= maxPrice;
            const matchesRating = rating === 0 || product.rating >= rating;

            return matchesSearchTerm && matchesCategory && matchesPrice && matchesRating;
        });

        displayProducts(filteredProducts);
    }

    // Funktion, um die Produkte anzuzeigen
    function displayProducts(products) {
        const productList = document.getElementById("product-list");
        productList.innerHTML = ""; // Leere die Produktliste

        if (products.length === 0) {
            productList.innerHTML = "<div class='no-results'>Keine Produkte gefunden.</div>";
        } else {
            products.forEach(product => {
                const productCard = document.createElement("div");
                productCard.classList.add("product-card");
                productCard.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" />
                    <h3>${product.name}</h3>
                    <p>Preis: €${product.price}</p>
                    <p>Bewertung: ${product.rating} Sterne</p>
                    <button class="add-to-cart-btn" onclick="addToCart('${product.name}', ${product.price})">In den Warenkorb</button>
                `;
                productList.appendChild(productCard);
            });
        }
    }

    // Funktion, um Produkte zum Warenkorb hinzuzufügen
    function addToCart(name, price) {
        const cart = JSON.parse(localStorage.getItem("cart")) || [];
        const product = { name, price };
        cart.push(product);
        localStorage.setItem("cart", JSON.stringify(cart));
        alert(`${name} wurde zum Warenkorb hinzugefügt!`);
    }

    // Initiale Anzeige aller Produkte
    displayProducts(products);
</script>

</body>
</html>
