<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Hunde Produkte - Petstore25</title>
  <style>
   body {
      background-color: #f9f9f9;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background-color: #004d00;
      color: white;
      padding: 15px 0;
      text-align: center;
    }

    h1 {
      font-size: 2.2em;
      margin: 0;
    }

    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin: 10px 0;
    }

    .dropdown {
      position: relative;
    }

    .dropbtn {
      background-color: #4CAF50;
      color: white;
      padding: 10px 18px;
      font-size: 1em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }

    .dropbtn:hover {
      background-color: #45a049;
    }

    .dropdown-content {
      display: none;
      position: absolute;
      background-color: #4CAF50;
      min-width: 180px;
      border-radius: 0 0 5px 5px;
      z-index: 1;
    }

    .dropdown-content a {
      color: white;
      padding: 10px 16px;
      text-decoration: none;
      display: block;
    }

    .dropdown-content a:hover {
      background-color: #45a049;
    }

    .dropdown:hover .dropdown-content {
      display: block;
    }

    .cart-link {
      font-size: 1em;
      color: white;
      text-decoration: none;
      background-color: #4CAF50;
      padding: 10px 18px;
      border-radius: 5px;
    }

    .cart-link:hover {
      background-color: #45a049;
    }

    main {
      padding: 40px 20px;
      text-align: center;
    }

    h2 {
      color: #004d00;
      font-size: 2em;
      margin-bottom: 30px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .product {
      background-color: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }

    .product img {
      width: 100%;
      height: auto; /* Die Höhe wird automatisch angepasst */
      object-fit: contain; /* Das Bild wird im Container skaliert, ohne beschnitten zu werden */
      border-radius: 6px;
      margin-bottom: 10px;
    }

    .product p {
      font-size: 1.1em;
      margin: 10px 0;
    }

    .product button {
      background-color: #004d00;
      color: white;
      padding: 10px 15px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1em;
      transition: background-color 0.3s ease;
    }

    .product button:hover {
      background-color: #45a049;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
      font-size: 0.9em;
    }
  </style>
</head>
<body>
  <div id="site-header"></div>

  <main>
    <h2>Produkte für Katzen</h2>
    <div class="product-grid">
      <div class="product">
        <img src="katzenfutter.jpg" alt="Katzenfutter Premium">
        <p>Katzenfutter Premium – €14.99</p>
        <button onclick="addToCart('Katzenfutter Premium', 14.99)">In den Warenkorb</button>
      </div>
      <div class="product">
        <img src="katzenspielzeug.jpg" alt="Katzenspielzeug Interaktiv">
        <p>Katzenspielzeug Interaktiv – €9.99</p>
        <button onclick="addToCart('Katzenspielzeug Interaktiv', 9.99)">In den Warenkorb</button>
      </div>
      <div class="product">
        <img src="katzenbett.jpg" alt="Katzenbett Deluxe">
        <p>Katzenbett Deluxe – €29.99</p>
        <button onclick="addToCart('Katzenbett Deluxe', 29.99)">In den Warenkorb</button>
      </div>
    </div>
  </main>

  <main>
    <h2>Produkte für Hunde</h2>
    <div class="product-grid">
      <div class="product">
        <img src="hundefutter.jpg" alt="Hundefutter Premium">
        <p>Hundefutter Premium – €19.99</p>
        <button onclick="addToCart('Hundefutter Premium', 19.99)">In den Warenkorb</button>
      </div>
      <div class="product">
        <img src="hundespielzeug.jpg" alt="Hundespielzeug Interaktiv">
        <p>Hundespielzeug Interaktiv – €12.99</p>
        <button onclick="addToCart('Hundespielzeug Interaktiv', 12.99)">In den Warenkorb</button>
      </div>
      <div class="product">
        <img src="hundebett.jpg" alt="Hundebett Deluxe">
        <p>Hundebett Deluxe – €34.99</p>
        <button onclick="addToCart('Hundebett Deluxe', 34.99)">In den Warenkorb</button>
      </div>
    </div>
  </main>


  <footer>
    &copy; 2025 Petstore25 – Alle Rechte vorbehalten.
  </footer>

  <script>
    // Header laden
    fetch('header.html')
      .then(response => response.text())
      .then(data => {
        document.getElementById('site-header').innerHTML = data;
        updateCartDisplay(); // sicherstellen, dass Warenkorb aktualisiert wird
      });

    // Warenkorb-Logik
    function addToCart(item, price) {
      let cartItems = JSON.parse(localStorage.getItem('cart')) || [];
      let existingItem = cartItems.find(cartItem => cartItem.name === item);
      if (!existingItem) {
        cartItems.push({ name: item, price: price });
        alert(`${item} wurde zum Warenkorb hinzugefügt! Preis: €${price.toFixed(2)}`);
      } else {
        alert(`${item} ist bereits im Warenkorb.`);
      }
      localStorage.setItem('cart', JSON.stringify(cartItems));
      updateCartDisplay();
    }

    function updateCartDisplay() {
      let cartItems = JSON.parse(localStorage.getItem('cart')) || [];
      let cartLink = document.querySelector('.cart-link');
      cartLink.textContent = `Warenkorb (${cartItems.length})`;
    }

    window.onload = updateCartDisplay;
  </script>
</body>
</html>
